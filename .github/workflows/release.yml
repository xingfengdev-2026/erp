name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: erp
            artifact: erp-x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: erp.exe
            artifact: erp-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: erp
            artifact: erp-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        working-directory: erp
        run: cargo build --release --target ${{ matrix.target }} --bin erp
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "erp/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Build bundled erp runtime
        run: bash erp-gui/tool/build_android_runtime.sh
      - name: Install dependencies
        working-directory: erp-gui
        run: flutter pub get
      - name: Build Android APK
        working-directory: erp-gui
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp erp-gui/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/erp-gui-arm64-v8a.apk
          cp erp-gui/build/app/outputs/flutter-apk/app-x86_64-release.apk dist/erp-gui-x86_64.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/erp-gui-*.apk

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: erp-gui
        run: flutter pub get
      - name: Build Windows GUI
        working-directory: erp-gui
        run: flutter build windows --release
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path erp-gui\build\windows\x64\runner\Release\* -DestinationPath dist\erp-gui-windows-x64.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/erp-gui-windows-x64.zip
